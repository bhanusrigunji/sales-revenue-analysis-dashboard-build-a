<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Performance Dashboard</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#355070;--wine:#b56576;--cream:#fff8ed;--orange:#d98e04;--purple:#423c6a;--mint:#e56b6f;--line:#dfe5ec;--ink:#27364d;--muted:#728096}*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:var(--ink);font:14px/1.35 Inter,Arial,sans-serif}.page{max-width:1480px;margin:0 auto;padding:24px}.hero{background:linear-gradient(120deg,#355070,#423c6a);border-radius:16px;padding:22px 26px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:20px;box-shadow:0 9px 24px #35435c3b}.hero h1{margin:0;font-size:26px;letter-spacing:.2px}.hero p{margin:5px 0 0;color:#e6edf7}.upload{border:1px solid #ffffff61;border-radius:8px;background:#ffffff17;color:#fff;padding:10px 13px;font-weight:700;cursor:pointer}.upload input{display:none}.filters{margin:16px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:end;background:#fff;padding:13px 15px;border-radius:10px;box-shadow:0 2px 8px #28395110}.field{display:grid;gap:4px}.field label{font-size:11px;font-weight:700;color:var(--muted)}select,input{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;color:var(--ink);background:#fff}.reset{height:34px;border:0;border-radius:6px;background:#edf0f5;color:var(--navy);padding:0 12px;font-weight:700;cursor:pointer}.summary{font-size:12px;color:var(--muted);margin-left:auto}.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 14px}.kpi{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 2px 9px #28395112;border-bottom:3px solid var(--wine)}.kpi:nth-child(2){border-color:var(--orange)}.kpi:nth-child(3){border-color:#e56b6f}.kpi:nth-child(4){border-color:var(--navy)}.kpi:nth-child(5){border-color:var(--purple)}.kpi label{display:block;color:var(--navy);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px}.kpi strong{display:block;font-size:25px;color:var(--wine);margin-top:7px}.kpi:nth-child(2) strong{color:var(--orange)}.kpi:nth-child(3) strong{color:#e56b6f}.kpi:nth-child(4) strong{color:var(--navy)}.kpi:nth-child(5) strong{color:var(--purple)}.grid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;margin-bottom:14px}.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 2px 9px #28395112;min-width:0}.card h2{font-size:14px;color:var(--navy);margin:0 0 12px;text-align:center}.card small{color:var(--muted);font-weight:400}.wide{grid-column:span 2}svg{width:100%;height:245px;display:block}.tabs{display:flex;justify-content:center;gap:5px;margin:-2px 0 8px}.tabs button{border:0;border-radius:5px;padding:6px 9px;font-size:11px;font-weight:700;color:var(--navy);background:#e9eff7;cursor:pointer}.tabs button.active{color:#fff;background:var(--navy)}.legend{display:flex;justify-content:center;gap:13px;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:2px}.message{position:fixed;right:20px;bottom:20px;background:#355070;color:#fff;padding:11px 15px;border-radius:8px;opacity:0;transition:.2s}.message.on{opacity:1}@media(max-width:1050px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}}@media(max-width:640px){.page{padding:12px}.hero{display:block}.upload{display:inline-block;margin-top:14px}.kpis,.grid{grid-template-columns:1fr}.wide{grid-column:span 1}.summary{margin-left:0}.filters{align-items:stretch}.field,select{width:100%}}
</style></head><body><main class="page"><header class="hero"><div><h1>Sales Performance Dashboard</h1><p>Business overview · sales, profit, customers &amp; products</p></div><label class="upload">Import Excel / CSV<input id="file" type="file" accept=".xlsx,.xls,.csv,.json"></label></header>
<section class="filters"><div class="field"><label>Region</label><select id="region"></select></div><div class="field"><label>Category</label><select id="category"></select></div><div class="field"><label>Segment</label><select id="segment"></select></div><div class="field"><label>Channel</label><select id="channel"></select></div><button class="reset" id="reset">Reset filters</button><button class="reset" id="database">Paste database results</button><span class="summary" id="summary"></span></section>
<section class="kpis"><article class="kpi"><label>Total customers</label><strong id="customers">—</strong></article><article class="kpi"><label>Total orders</label><strong id="orders">—</strong></article><article class="kpi"><label>Total quantity</label><strong id="quantity">—</strong></article><article class="kpi"><label>Total sales</label><strong id="sales">—</strong></article><article class="kpi"><label>Total profit</label><strong id="profit">—</strong></article></section>
<section class="grid"><article class="card wide"><h2>Sales vs. profit by city <small>(sales and profit comparison)</small></h2><svg id="cityChart" role="img" aria-label="Sales and profit by city"></svg></article><article class="card"><h2>Profit by month</h2><svg id="monthChart" role="img" aria-label="Monthly profit"></svg></article></section>
<section class="grid"><article class="card"><h2>Top 5 customers by sales</h2><svg id="customerChart" role="img" aria-label="Top customers"></svg></article><article class="card"><h2>Top 5 products by sales</h2><svg id="productChart" role="img" aria-label="Top products"></svg></article><article class="card"><h2>Profit percentage by segment</h2><svg id="segmentChart" role="img" aria-label="Profit share by segment"></svg></article></section>
<section class="card"><h2>Sales analysis</h2><div class="tabs"><button class="active" data-view="month">Sales by month</button><button data-view="category">Sales by category</button><button data-view="segment">Sales by segment</button></div><svg id="salesChart" role="img" aria-label="Switchable sales analysis"></svg></section></main><div class="message" id="toast"></div>
<script>
const currencies=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}),integer=new Intl.NumberFormat('en-US');let view='month',source=[];
const names=['Aarav Shah','Maya Patel','Noah Smith','Olivia Jones','Liam Wilson','Emma Brown','Ethan Davis','Sophia Miller','Lucas Garcia','Ava Taylor'],products=[['Office Chair','Furniture',380],['Standing Desk','Furniture',620],['Wireless Headset','Technology',160],['Laptop Pro','Technology',1250],['Notebook Set','Office Supplies',35],['Ergo Keyboard','Technology',115],['Task Lamp','Furniture',90],['Printer Ink','Office Supplies',65]],cities=[['New York','East'],['Chicago','Central'],['Seattle','West'],['Austin','South'],['Boston','East'],['Denver','West']],segments=['Consumer','Corporate','Home Office'],channels=['Online','Retail','Partner'];
function pseudo(n){let x=Math.sin(n*717.3)*10000;return x-Math.floor(x)}function demo(){let out=[];for(let i=0;i<480;i++){let p=products[i%8],q=1+Math.floor(pseudo(i)*7),city=cities[i%6],sale=Math.round(p[2]*q*(.85+pseudo(i+8)*.35)),margin=.12+pseudo(i+19)*.18;out.push({date:new Date(2025,0,i%12*2+1+(i%17)).toISOString().slice(0,10),customer:names[(i*7+i%3)%10],product:p[0],category:p[1],city:city[0],region:city[1],segment:segments[(i*5+i%2)%3],channel:channels[i%3],sales:sale,profit:Math.round(sale*margin),quantity:q,orders:1})}return out}
function clean(rows){return rows.map((r,i)=>{let o={};for(const [k,v] of Object.entries(r))o[k.toLowerCase().replace(/[^a-z]/g,'')]=v;let sale=+String(o.sales||o.revenue||o.amount||0).replace(/[$,]/g,'')||0;return{date:String(o.date||o.orderdate||'').slice(0,10),customer:String(o.customer||o.customername||names[i%10]),product:String(o.product||o.productname||'Unspecified'),category:String(o.category||'Other'),city:String(o.city||cities[i%6][0]),region:String(o.region||cities[i%6][1]),segment:String(o.segment||segments[i%3]),channel:String(o.channel||channels[i%3]),sales:sale,profit:+String(o.profit||sale*(.16+(i%5)/100)).replace(/[$,]/g,'')||0,quantity:+(o.quantity||o.units||o.qty||1),orders:+(o.orders||1)}}).filter(x=>x.sales>0)}
function parseCSV(t){let l=t.trim().split(/\r?\n/),h=l.shift().split(',').map(x=>x.trim());return l.map(x=>Object.fromEntries(h.map((z,i)=>[z,x.split(',')[i]?.trim()||''])))}function opt(id){let el=document.getElementById(id),old=el.value,vals=[...new Set(source.map(x=>x[id]))].sort();el.innerHTML='<option value="">All</option>'+vals.map(x=>`<option>${x}</option>`).join('');el.value=old}function setup(){['region','category','segment','channel'].forEach(opt)}function rows(){return source.filter(x=>['region','category','segment','channel'].every(k=>!document.getElementById(k).value||x[k]===document.getElementById(k).value))}function sum(a,k){return a.reduce((s,x)=>s+(+x[k]||0),0)}function grouped(a,k,metric){return Object.entries(a.reduce((o,x)=>{o[x[k]]=(o[x[k]]||0)+x[metric];return o},{})).sort((a,b)=>b[1]-a[1])}
function svg(id,html,w=440,h=245){let e=document.getElementById(id);e.setAttribute('viewBox',`0 0 ${w} ${h}`);e.innerHTML=html}function empty(id){svg(id,'<text x="50%" y="50%" text-anchor="middle" fill="#728096">No data for these filters</text>')}
function horizontal(id,values,color){if(!values.length)return empty(id);let w=440,left=135,max=Math.max(...values.map(x=>x[1]))*1.15;svg(id,values.slice(0,5).map(([n,v],i)=>{let y=13+i*43,b=(w-left-55)*v/max;return `<text x="${left-7}" y="${y+19}" text-anchor="end" font-size="11" fill="#27364d">${n}</text><rect x="${left}" y="${y+4}" width="${b}" height="21" rx="4" fill="${color}"/><text x="${left+b+6}" y="${y+19}" font-size="10" fill="#526078">${currencies.format(v)}</text>`}).join(''))}
function city(a){let v=grouped(a,'city','sales').map(([n,s])=>[n,s,sum(a.filter(x=>x.city===n),'profit')]).slice(0,6);if(!v.length)return empty('cityChart');let w=700,l=50,base=212,max=Math.max(...v.flatMap(x=>[x[1],x[2]]))*1.18,step=(w-l-18)/v.length,html=[.25,.5,.75,1].map(n=>`<line x1="${l}" x2="${w-8}" y1="${base-base*n}" y2="${base-base*n}" stroke="#edf0f4"/>`).join('');v.forEach(([n,s,p],i)=>{let x=l+i*step+step*.18,hs=base*s/max,hp=base*p/max;html+=`<rect x="${x}" y="${base-hs}" width="${step*.24}" height="${hs}" rx="3" fill="#d98e04"/><rect x="${x+step*.27}" y="${base-hp}" width="${step*.24}" height="${hp}" rx="3" fill="#355070"/><text x="${x+step*.25}" y="${base+15}" text-anchor="middle" font-size="10" fill="#526078">${n}</text>`});html+=`<text x="${l}" y="${base+31}" font-size="10" fill="#728096">Sales</text><rect x="${l+33}" y="${base+23}" width="8" height="8" fill="#d98e04"/><text x="${l+47}" y="${base+31}" font-size="10" fill="#728096">Profit</text><rect x="${l+85}" y="${base+23}" width="8" height="8" fill="#355070"/>`;svg('cityChart',html,700)}
function area(a){let m={};a.forEach(x=>{let k=x.date?.slice(0,7)||'Unknown';m[k]=(m[k]||0)+x.profit});let v=Object.entries(m).sort(),w=420,h=245,l=36,b=205,max=Math.max(...v.map(x=>x[1]),1)*1.2;if(!v.length)return empty('monthChart');let pts=v.map((x,i)=>[l+i*(w-l-12)/Math.max(v.length-1,1),b-x[1]/max*(b-18)]),d=pts.map((p,i)=>(i?'L':'M')+p.join(',')).join(' '),fill=d+` L${pts.at(-1)[0]},${b} L${pts[0][0]},${b} Z`;svg('monthChart',[.25,.5,.75,1].map(n=>`<line x1="${l}" x2="${w-10}" y1="${b-b*n}" y2="${b-b*n}" stroke="#edf0f4"/>`).join('')+`<path d="${fill}" fill="#423c6a33"/><path d="${d}" fill="none" stroke="#423c6a" stroke-width="3"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#423c6a"/><text x="${p[0]}" y="${b+15}" text-anchor="middle" font-size="9" fill="#728096">${v[i][0].slice(5)}</text>`).join(''),420)}
function pie(a){let vals=grouped(a,'segment','profit'),total=sum(a,'profit')||1,cx=158,cy=122,r=78,ang=-Math.PI/2,colors=['#355070','#b56576','#d98e04'],html='';vals.forEach(([n,v],i)=>{let end=ang+v/total*2*Math.PI,x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang),x2=cx+r*Math.cos(end),y2=cy+r*Math.sin(end);html+=`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${end-ang>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${colors[i]}"/>`;ang=end});html+=`<circle cx="${cx}" cy="${cy}" r="48" fill="white"/><text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="10" fill="#728096">Profit</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-weight="700" font-size="14" fill="#27364d">${currencies.format(total)}</text>`+vals.map(([n,v],i)=>`<rect x="275" y="${70+i*31}" width="9" height="9" rx="2" fill="${colors[i]}"/><text x="291" y="${79+i*31}" font-size="11" fill="#526078">${n}</text><text x="396" y="${79+i*31}" text-anchor="end" font-size="11" font-weight="700" fill="#27364d">${Math.round(v/total*100)}%</text>`).join('');svg('segmentChart',html,420)}
function salesView(a){let key=view==='month'?'date':view,vals;if(key==='date'){let o={};a.forEach(x=>{let k=x.date?.slice(0,7)||'Unknown';o[k]=(o[k]||0)+x.sales});vals=Object.entries(o).sort().map(([k,v])=>[k.slice(5),v])}else vals=grouped(a,key,'sales');if(!vals.length)return empty('salesChart');let w=1050,h=245,l=48,b=200,max=Math.max(...vals.map(x=>x[1]))*1.15,step=(w-l-15)/vals.length;svg('salesChart',vals.map((x,i)=>{let bh=x[1]/max*(b-15),x0=l+i*step+step*.18;return `<rect x="${x0}" y="${b-bh}" width="${Math.max(10,step*.55)}" height="${bh}" rx="3" fill="#b56576"/><text x="${x0+step*.28}" y="${b+15}" text-anchor="middle" font-size="10" fill="#526078">${x[0]}</text>`}).join(''),1050)}
function draw(){let a=rows(),cust=[...new Set(a.map(x=>x.customer))],o=sum(a,'orders'),q=sum(a,'quantity'),s=sum(a,'sales'),p=sum(a,'profit');customers.textContent=integer.format(cust.length);orders.textContent=integer.format(o);quantity.textContent=integer.format(q);sales.textContent=currencies.format(s);profit.textContent=currencies.format(p);summary.textContent=`${integer.format(a.length)} records · ${currencies.format(s)} sales`;city(a);area(a);horizontal('customerChart',grouped(a,'customer','sales'),'#355070');horizontal('productChart',grouped(a,'product','sales'),'#d98e04');pie(a);salesView(a)}
document.querySelectorAll('select').forEach(x=>x.onchange=draw);reset.onclick=()=>{document.querySelectorAll('select').forEach(x=>x.value='');draw()};database.onclick=()=>{let t=prompt('Paste database query results as CSV (include a header row) or a JSON array.');if(t===null||!t.trim())return;try{source=clean(t.trim().startsWith('[')?JSON.parse(t):parseCSV(t));if(!source.length)throw Error();setup();draw();notify(`${integer.format(source.length)} database records loaded`)}catch{notify('Could not parse these database results.')}};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));draw()});function notify(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2600)}file.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>{try{let z=f.name.match(/xlsx?$/i)?XLSX.utils.sheet_to_json(XLSX.read(x.target.result,{type:'array'}).Sheets[XLSX.read(x.target.result,{type:'array'}).SheetNames[0]]):f.name.match(/json$/i)?JSON.parse(x.target.result):parseCSV(x.target.result);source=clean(z);if(!source.length)throw Error();setup();draw();notify(`${integer.format(source.length)} records imported`)}catch{notify('Import failed — check headers and data format.')}};f.name.match(/xlsx?$/i)?r.readAsArrayBuffer(f):r.readAsText(f)};source=demo();setup();draw();
</script></body></html>
